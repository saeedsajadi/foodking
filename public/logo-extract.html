<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: #fff; }
      #wrap { display: inline-block; line-height: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="wrap"></div>
    <script type="module">
      import * as pdfjs from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs'
      pdfjs.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs'
      const loadingTask = pdfjs.getDocument('/fk-logo.pdf')
      const pdf = await loadingTask.promise
      const page = await pdf.getPage(1)
      const scale = 6
      const viewport = page.getViewport({ scale })
      const canvas = document.createElement('canvas')
      canvas.width = Math.floor(viewport.width)
      canvas.height = Math.floor(viewport.height)
      document.getElementById('wrap').appendChild(canvas)
      const ctx = canvas.getContext('2d')
      await page.render({ canvasContext: ctx, viewport }).promise
      window.__logoSize = { w: canvas.width, h: canvas.height }
      const marker = document.createElement('div')
      marker.id = 'done'
      marker.textContent = 'RENDER_DONE ' + canvas.width + 'x' + canvas.height
      marker.style.position = 'fixed'
      marker.style.left = '-9999px'
      document.body.appendChild(marker)
    </script>
  </body>
</html>
